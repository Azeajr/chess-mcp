name: Deploy PWA to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main, feat/node-mcp-rewrite]
    paths:
      - "apps/ui/src/**"
      - "apps/ui/public/**"
      - "apps/ui/index.html"
      - "apps/ui/package.json"
      - "apps/ui/vite.config.*"
      - "apps/ui/tsconfig*"
      - "packages/**"
      - ".github/workflows/deploy-ui.yml"
      - ".github/workflows/ui-checks.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "!**/*.test.*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate the PWA revision to deploy
    uses: ./.github/workflows/ui-checks.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 26

      # Downloads from this workflow run only; the name binds it to the validated revision.
      # Both push branches and workflow_dispatch pass through the same required validation job.
      - name: Download validated PWA
        uses: actions/download-artifact@v6
        with:
          name: pwa-${{ github.sha }}
          path: apps/ui/dist

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy apps/ui/dist --project-name chess-repertoire-analysis --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
