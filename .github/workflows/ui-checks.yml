name: UI validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: UI — typecheck, unit, PWA build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chess-mcp/chess-tools build
      - run: pnpm --filter @chess-mcp/ui typecheck
      - run: pnpm --filter @chess-mcp/ui test:chat
      - name: Production PWA build assertions
        run: |
          pnpm --filter @chess-mcp/ui build
          node --test apps/ui/test/pwa-build.test.mjs
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Production offline behavior and service-worker update lifecycle
        run: |
          pnpm exec playwright install chromium
          node apps/ui/test/pwa-lifecycle.mjs
          node --test apps/ui/test/pwa-build.test.mjs

      - name: Preserve validated PWA
        uses: actions/upload-artifact@v6
        with:
          name: pwa-${{ github.sha }}
          path: apps/ui/dist
          if-no-files-found: error
          retention-days: 1
