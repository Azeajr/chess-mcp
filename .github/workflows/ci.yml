name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node — build, typecheck, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6 # version resolved from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Plugin skills in sync with dev skills (no drift)
        run: pnpm check:skills # fix with `pnpm sync:skills` (.claude/skills → plugin/skills)
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Build chess-tools (dist used by the smoke scripts)
        run: pnpm --filter @chess-mcp/chess-tools build
      - name: Generated documentation is current
        run: pnpm docs:check
      - name: Browser content registry is complete
        run: pnpm check:content
      - name: Typecheck all packages
        run: pnpm -r typecheck
      - name: Tool contract parity (contract vs browser registry vs MCP server)
        run: pnpm check:tool-contract
      - name: Legacy import boundary
        run: pnpm check:legacy-imports
      - name: Strategic Fit domain suite
        run: pnpm test:strategic-fit
      # The non-strategic-fit half of chess-tools had no unit suite at all — 50 test files existed
      # and every one of them was under test/strategic-fit/.
      - name: chess-tools core suite
        run: pnpm test:chess-tools
      - name: Design token, responsive tier, and primitive contracts
        run: node --test scripts/wp020-responsive-tiers.test.mjs scripts/wp036-design-tokens.test.mjs scripts/wp037-primitives.test.mjs
      - name: Deterministic smoke suites (engine-free, no network)
        run: |
          node scripts/smoke-gametree.mjs
          node scripts/structure-accuracy.mjs
      # Engine-free unit suites for the MCP server's own modules. They gated nothing until now:
      # each was runnable only from the `// Run:` comment in its own header. Every one sets the env
      # it needs and exits non-zero on failure, so they need no wrapper. perftools reads
      # chess-tools `dist`, built above.
      - name: MCP server unit suites (paths guard, eval cache, handle cache, perf tools)
        run: |
          node --import tsx apps/mcp-server/test/confine.mjs
          node --import tsx apps/mcp-server/test/cache.mjs
          node --import tsx apps/mcp-server/test/handles.mjs
          node --import tsx apps/mcp-server/test/perftools.mjs
      - name: MCP stdio smoke (engine on, network assertions gated out)
        env:
          SMOKE_NETWORK: "0" # skip live Lichess/Chess.com; engine + local paths still run
          EVAL_CACHE_DIR: "0" # cold cache — CI must not depend on a warm eval store
        run: node apps/mcp-server/test/smoke-client.mjs

  ui:
    name: UI — store and browser regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chess-mcp/chess-tools build
      - run: pnpm --filter @chess-mcp/ui typecheck
      - run: pnpm --filter @chess-mcp/ui test:chat
      # WP-019 AC-4 and the real service-worker lifecycle. The dev-seam spec in
      # test/e2e/pwa-update.spec.ts cannot prove Workbox leaves build B waiting; these two run
      # against real production output, so they need the build first.
      - name: Production PWA build assertions
        run: |
          pnpm --filter @chess-mcp/ui build
          node --test apps/ui/test/pwa-build.test.mjs
      - name: Real service-worker update lifecycle (build A to build B)
        # Runs on the host, not in the e2e container, so it needs its own browser. The container
        # image that serves `test:e2e:container` is not on this job's PATH.
        run: |
          pnpm exec playwright install --with-deps chromium
          node apps/ui/test/pwa-lifecycle.mjs
      - run: pnpm test:e2e:container
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/ui/playwright-report
          if-no-files-found: ignore

  release:
    name: GitHub release
    needs: node # plugin ships from the repo; gate on the product build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --verify-tag \
            --generate-notes
