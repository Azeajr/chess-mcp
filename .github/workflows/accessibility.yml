name: Accessibility

on:
  workflow_dispatch:
  push:
    branches: [main, salvage]
    paths:
      - ".github/workflows/accessibility.yml"
      - "apps/ui/src/**"
      - "apps/ui/test/accessibility/**"
      - "apps/ui/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/chess-tools/**"
  pull_request:
    paths:
      - ".github/workflows/accessibility.yml"
      - "apps/ui/src/**"
      - "apps/ui/test/accessibility/**"
      - "apps/ui/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/chess-tools/**"

permissions:
  contents: read

env:
  # One run ID shared by every job below, so their independently-computed evidence lands in the
  # same directory and merge-report can actually merge it. Without this each job's capture.mjs
  # would mint its own timestamp and there would be nothing to merge — this is the exact bug
  # found and fixed locally when three parallel Playwright workers each generated a different ID.
  A11Y_RUN_ID: a11y-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # Proven: this exact invocation (A11Y_CONTAINER=1 node capture.mjs) was run locally against the
  # live app and produced real confirmed-pass findings across all three engines, citations
  # verified against raw evidence. ubuntu-latest ships Docker by default, so this needs no setup
  # beyond checkout/pnpm/node — same Docker mechanism the existing `ui` CI job already trusts for
  # the main e2e suite (scripts/playwright-container.mjs).
  browser-evidence:
    name: Browser evidence — Chromium, Firefox, WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chess-mcp/chess-tools build
      # One capture.mjs invocation covering both specs: Playwright's own outputDir is the parent
      # of EVIDENCE_ROOT and is wiped at the start of every `playwright test` run, so a second
      # invocation here would erase the first invocation's evidence before merge-report saw it.
      - name: Capture deterministic evidence — AG-3 + AG-4 + AG-5 (Docker, all three engines)
        working-directory: apps/ui
        run: node test/accessibility/capture.mjs
        env:
          A11Y_CONTAINER: "1"
          A11Y_SPEC: ag-3-move-tree.spec.ts,ag-4-board-keyboard.spec.ts,ag-5-live-region.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: a11y-evidence-browser
          path: apps/ui/test-results/accessibility/${{ env.A11Y_RUN_ID }}/*.json
          if-no-files-found: error

  # Proven by the AG-1 runs recorded in docs/accessibility/README.md. Each native-AT job captures
  # every registered scenario in one session instead of repeating the fragile OS setup per gate.
  # Missing artifacts or an inconclusive utterance verdict fail the merge job; no artifact
  # inspection is required.
  at-nvda:
    name: AT evidence — NVDA (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - id: guidepup_setup
        uses: guidepup/setup-action@0.21.0
        continue-on-error: true
      - name: Retry Guidepup OS setup after an infrastructure failure
        if: steps.guidepup_setup.outcome == 'failure'
        uses: guidepup/setup-action@0.21.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chess-mcp/chess-tools build
      - run: pnpm exec playwright install chromium
        working-directory: apps/ui
      # guidepup/setup-action only configures the OS (the `@guidepup/setup setup` half). It does
      # not install the project-scoped screen reader assets — the run that failed here without
      # this step errored "NVDA is not installed" and named this exact missing command.
      - run: npx @guidepup/setup install nvda
        working-directory: apps/ui
      # One invocation for the same reason as browser-evidence above — see its comment.
      - name: Capture NVDA evidence — AG-3 + AG-4 + AG-5 (headed — NVDA reads the real screen)
        working-directory: apps/ui
        run: node test/accessibility/capture.mjs --project chromium
        env:
          A11Y_ATTEMPT_AT: "1"
          A11Y_SPEC: ag-3-move-tree.spec.ts,ag-4-board-keyboard.spec.ts,ag-5-live-region.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-evidence-nvda
          path: apps/ui/test-results/accessibility/${{ env.A11Y_RUN_ID }}/*.json
          if-no-files-found: warn

  # Proven as of run 32210865750 — describeItemWithKeyboardFocus reports real page content
  # ("Return to repertoire button has keyboard focus"), matching NVDA's real target. Safari/WebKit
  # is VoiceOver's natural pairing on macOS, hence --project webkit here versus --project chromium
  # for NVDA.
  at-voiceover:
    name: AT evidence — VoiceOver (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - id: guidepup_setup
        uses: guidepup/setup-action@0.21.0
        continue-on-error: true
      - name: Retry Guidepup OS setup after an infrastructure failure
        if: steps.guidepup_setup.outcome == 'failure'
        uses: guidepup/setup-action@0.21.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chess-mcp/chess-tools build
      - run: pnpm exec playwright install webkit
        working-directory: apps/ui
      # Same missing step as at-nvda — the actual run here failed with "Failed to mount Guidepup
      # preferences" and named this exact command as the fix.
      - run: npx @guidepup/setup install voiceover
        working-directory: apps/ui
      # One invocation for the same reason as browser-evidence above — see its comment.
      - name: Capture VoiceOver evidence — AG-3 + AG-4 + AG-5 (headed — VoiceOver reads the real screen)
        working-directory: apps/ui
        run: node test/accessibility/capture.mjs --project webkit
        env:
          A11Y_ATTEMPT_AT: "1"
          A11Y_SPEC: ag-3-move-tree.spec.ts,ag-4-board-keyboard.spec.ts,ag-5-live-region.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-evidence-voiceover
          path: apps/ui/test-results/accessibility/${{ env.A11Y_RUN_ID }}/*.json
          if-no-files-found: warn

  merge-report:
    name: Compute AG-3/AG-4/AG-5 gate verdicts
    needs: [browser-evidence, at-nvda, at-voiceover]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download all evidence into one run directory
        uses: actions/download-artifact@v4
        with:
          pattern: a11y-evidence-*
          path: apps/ui/test-results/accessibility/${{ env.A11Y_RUN_ID }}
          merge-multiple: true
      - name: Compute verdict
        working-directory: apps/ui
        run: pnpm a11y:verdict
        env:
          A11Y_SCENARIOS: ag-3-move-tree,ag-4-board-keyboard,ag-5-live-region
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: |
            apps/ui/test-results/accessibility/${{ env.A11Y_RUN_ID }}/report.json
            apps/ui/test-results/accessibility/${{ env.A11Y_RUN_ID }}/report.md
